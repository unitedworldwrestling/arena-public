# Docker Compose configuration for the beta environment of the Arena application
# This file defines the services and images used for the beta environment of the Arena application.
# This configuration is intended for use in the beta environment only.
#
# Usage:
#   docker compose -f docker-compose.yaml -f docker-compose-beta.yaml pull
#   docker compose -f docker-compose.yaml -f docker-compose-beta.yaml up -d
#
services:
    php-fpm:
        image: public.ecr.aws/uww/app/arena:beta

    arena-mq-processor:
        image: public.ecr.aws/uww/app/arena:beta

    arena-periodic-jobs:
        image: public.ecr.aws/uww/app/arena:beta

    nginx:
        image: public.ecr.aws/uww/app/arena-web:beta
    caddy:
        image: public.ecr.aws/uww/app/arena-mercure:beta

